name: Test catalogo AROME e palette
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/arome_parameters.py'
      - 'scripts/update_arome_hd.py'
      - 'tests/test_arome_extended.py'
      - '.github/workflows/test-arome-extended.yml'
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Installa librerie per il test senza scaricare i GRIB
        run: python -m pip install --disable-pip-version-check numpy pillow eccodes
      - name: Verifica sintassi ed esegui test di generazione
        run: |
          python -m py_compile scripts/arome_parameters.py scripts/update_arome_hd.py
          python -m unittest discover -s tests -p 'test_arome_extended.py' -v
