name: Probe DPC LTG

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/probe-dpc-ltg.yml'

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Cerca file LTG esistente
        shell: bash
        run: |
          python - <<'PY'
          import urllib.request, urllib.error, datetime, struct
          base='https://s3-prod-dpc-radar-webp-cache.s3.eu-south-1.amazonaws.com/LGT/lgt_5min_{}.bin'
          now=datetime.datetime.now(datetime.timezone.utc)
          now=now.replace(second=0,microsecond=0,minute=(now.minute//5)*5)
          found=[]
          # 72 ore a passo 5 min: include le recenti fasi temporalesche sul Mediterraneo occidentale.
          for i in range(1, 72*12+1):
              d=now-datetime.timedelta(minutes=5*i)
              t=int(d.timestamp()*1000)
              u=base.format(t)
              req=urllib.request.Request(u,headers={'User-Agent':'Mozilla/5.0','Referer':'https://radar.protezionecivile.it/'})
              try:
                  with urllib.request.urlopen(req,timeout=8) as r:
                      b=r.read()
                  if b:
                      print('FOUND',d.isoformat(),t,len(b),'HEAD',b[:16].hex())
                      if len(b)>=3:
                          ver=b[0]; count=int.from_bytes(b[1:3],'big')
                          print('VERSION',ver,'COUNT',count)
                          # decode first 5 strikes using official frontend format
                          pos=3
                          for j in range(min(count,5)):
                              u16=int.from_bytes(b[pos:pos+2],'big'); p16=int.from_bytes(b[pos+2:pos+4],'big')
                              flags=b[pos+4]; g=b[pos+5]
                              xx=u16+((flags>>6)&3)*65536
                              yy=p16+((flags>>4)&3)*65536
                              lon=xx*(360/262144)-180
                              lat=yy*(180/262144)-90
                              print('STRIKE',j,lat,lon)
                              pos += 6 if g<255 else 8
                      found.append((t,len(b)))
                      if len(found)>=3: break
              except urllib.error.HTTPError as e:
                  if e.code not in (403,404): print('HTTP',e.code,u)
              except Exception as e:
                  print('ERR',type(e).__name__,u)
          print('FOUND_TOTAL',len(found))
          PY
