name: Probe DPC LTG

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/probe-dpc-ltg.yml'

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Verifica filename LTG
        shell: bash
        run: |
          set -euo pipefail
          API='https://radar-api.protezionecivile.it/findLastProductByType?type=SRI&lang=it'
          curl -fsSL "$API" -o /tmp/latest.json
          cat /tmp/latest.json
          python - <<'PY'
          import json, subprocess, datetime
          d=json.load(open('/tmp/latest.json'))
          p=d['lastProducts'][0]
          t=int(p['time'])
          print('\nTIME',t,'ISO',datetime.datetime.fromtimestamp(t/1000,datetime.timezone.utc))
          base='https://s3-prod-dpc-radar-webp-cache.s3.eu-south-1.amazonaws.com/LGT'
          vals=[str(t),str(t//1000)]
          dt=datetime.datetime.fromtimestamp(t/1000,datetime.timezone.utc)
          vals += [dt.strftime('%Y%m%d%H%M'),dt.strftime('%Y%m%dT%H%M'),dt.strftime('%Y-%m-%dT%H:%M:%S.000Z')]
          for v in vals:
              u=f'{base}/lgt_5min_{v}.bin'
              r=subprocess.run(['curl','-sS','-L','-o','/tmp/x.bin','-w','%{http_code} %{size_download} %{content_type}',u],capture_output=True,text=True)
              print(v,r.stdout,u)
              if r.stdout.startswith('200 '):
                  b=open('/tmp/x.bin','rb').read(16)
                  print('HEAD',b.hex())
          PY
