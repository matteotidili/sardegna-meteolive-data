name: Probe DPC LTG

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/probe-dpc-ltg.yml'

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Analizza frontend Radar-DPC per LTG
        shell: bash
        run: |
          set -u
          echo '=== RADAR APP HTML ==='
          curl -fsSL 'https://radar.protezionecivile.it/' -o /tmp/radar.html
          grep -oiE '<script[^>]+src="[^"]+"' /tmp/radar.html | head -40 || true
          grep -oiE 'src="[^"]+\.js[^"]*"' /tmp/radar.html | sed 's/^src="//;s/"$//' > /tmp/scripts.txt || true
          cat /tmp/scripts.txt || true

          echo '=== DOWNLOAD BUNDLES / SEARCH LTG ==='
          while IFS= read -r src; do
            [ -z "$src" ] && continue
            case "$src" in
              http*) url="$src" ;;
              /*) url="https://radar.protezionecivile.it$src" ;;
              *) url="https://radar.protezionecivile.it/$src" ;;
            esac
            name="/tmp/$(basename "$src" | cut -d'?' -f1)"
            curl -fsSL "$url" -o "$name" || continue
            echo "--- $url ($(wc -c < "$name") bytes)"
            grep -oEi '.{0,220}(LTG|lightning|lampinet|fulmin).{0,420}' "$name" | head -60 || true
          done < /tmp/scripts.txt

          echo '=== DIRECT HTML SEARCH ==='
          grep -oEi '.{0,200}(LTG|lightning|lampinet|fulmin).{0,400}' /tmp/radar.html | head -80 || true
