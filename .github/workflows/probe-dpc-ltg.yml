name: Probe DPC LTG

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/probe-dpc-ltg.yml'

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Verifica CORS LTG per GitHub Pages
        shell: bash
        run: |
          set -euo pipefail
          URL='https://s3-prod-dpc-radar-webp-cache.s3.eu-south-1.amazonaws.com/LGT/lgt_5min_1791129300000.bin'
          curl -sS -D /tmp/h -o /tmp/b -H 'Origin: https://matteotidili.github.io' -H 'Referer: https://matteotidili.github.io/sardegna-meteolive-web/' "$URL"
          grep -iE 'HTTP/|content-type|content-length|access-control-allow-origin|access-control-allow-methods|vary:' /tmp/h || true
          echo "bytes $(wc -c < /tmp/b)"
          python - <<'PY'
          b=open('/tmp/b','rb').read()
          print('version',b[0] if b else None,'count',int.from_bytes(b[1:3],'big') if len(b)>=3 else None)
          PY
