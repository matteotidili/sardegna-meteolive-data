name: Probe DPC LTG

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/probe-dpc-ltg.yml'

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Cerca endpoint realtime LTG Radar-DPC
        shell: bash
        run: |
          set -u
          curl -fsSL 'https://radar.protezionecivile.it/' -o /tmp/radar.html
          echo "HTML bytes: $(wc -c < /tmp/radar.html)"

          echo '=== URL / SOCKET / STOMP / TOPIC CONTEXT ==='
          for pat in 'Stomp' 'stomp' 'WebSocket' 'SockJS' 'wss://' 'ws://' '/topic/' '/queue/' 'brokerURL' 'activate()' 'subscribe(' 'radar-api' 's3-prod' 'light' 'fulmin' 'lampi' 'strike'; do
            echo "--- PATTERN: $pat"
            grep -oEi ".{0,260}${pat}.{0,600}" /tmp/radar.html | head -50 || true
          done

          echo '=== URL ABSOLUTI NEL DOCUMENTO ==='
          grep -oE 'https?://[^"<> ]+' /tmp/radar.html | sort -u | head -200 || true

          echo '=== JS/MJS/MODULE REFERENCES ==='
          grep -oEi '(src|href)="[^"]+\.(js|mjs)(\?[^"]*)?"' /tmp/radar.html | head -100 || true
          grep -oEi 'import\([^)]+' /tmp/radar.html | head -100 || true
