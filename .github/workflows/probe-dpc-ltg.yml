name: Probe DPC LTG

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/probe-dpc-ltg.yml'

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Analizza bundle applicazione Radar-DPC
        shell: bash
        run: |
          set -u
          curl -fsSL 'https://radar.protezionecivile.it/' -o /tmp/radar.html
          grep -oEi '(src|href)="[^"]+\.js(\?[^"]*)?"' /tmp/radar.html | sed -E 's/^(src|href)="//;s/"$//' | sort -u > /tmp/jsrefs.txt
          cat /tmp/jsrefs.txt

          echo '=== SEARCH APP BUNDLES ==='
          n=0
          while IFS= read -r src; do
            [ -z "$src" ] && continue
            case "$src" in
              http*) url="$src" ;;
              /*) url="https://radar.protezionecivile.it$src" ;;
              *) url="https://radar.protezionecivile.it/$src" ;;
            esac
            n=$((n+1))
            name="/tmp/app_$n.js"
            curl -fsSL "$url" -o "$name" || continue
            echo "--- $url ($(wc -c < "$name") bytes)"
            grep -oEi '.{0,300}(LTG|lightning|lampinet|fulmin|strike|brokerURL|wss://|ws://|/topic/|stompClient|StompJs|subscribe).{0,900}' "$name" | head -120 || true
            echo '--- ABS URLS'
            grep -oE 'https?://[^"'\''<> ]+|wss?://[^"'\''<> ]+' "$name" | sort -u | head -100 || true
          done < /tmp/jsrefs.txt
