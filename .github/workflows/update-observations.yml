name: Aggiorna tutte le reti stazioni

on:
  workflow_dispatch:
  # Torniamo al polling unificato di ottobre: WU, DPCN e AM nello stesso
  # workflow ogni 5 minuti, con trigger complementari quando GitHub ritarda.
  # I singoli updater mantengono i propri limiti di frequenza e i lock.
  workflow_run:
    workflows:
      - 'Aggiorna dati Weather Underground'
      - 'Aggiorna allerte MeteoAlarm Mediterraneo'
      # Backup indipendenti: quando GitHub ritarda o perde gli eventi cron
      # principali, una qualunque di queste reti riattiva DPCN e AM.
      - 'Aggiorna rete WeatherLink (accesso autorizzato)'
      - 'Aggiorna pluviometri Sardegna CEDOC'
      - 'Aggiorna incendi MTG FRP'
      - 'Aggiorna vettori AROME 10m'
      - 'Calcola accumuli pluviometrici 48 ore da tutte le reti'
      - 'Scopri stazioni Weather Underground'
    types: [completed]
  push:
    branches: [main]
    paths:
      - '.github/workflows/update-observations.yml'
  schedule:
    # Polling unificato ripristinato (5 min). Nuova pubblicazione del
    # workflow riavvia le tre reti senza toccare le chiavi API.
    # Lo scheduler GitHub puo' ritardare: sul sito le postazioni restano
    # visibili e gli ultimi valori sono marcati come NON aggiornati.
    - cron: '4,9,14,19,24,29,34,39,44,49,54,59 * * * *'

permissions:
  contents: write

jobs:
  update:
    name: Aggiorna ${{ matrix.network }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - network: meteohub
            file: stations
          - network: wunderground
            file: wunderground
          - network: am
            file: am
    # Stesso lock dei workflow manuali: niente doppie richieste alla stessa rete.
    concurrency:
      group: observations-${{ matrix.network }}
      cancel-in-progress: false
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Configura Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Aggiorna rete
        env:
          METEOHUB_USERNAME: ${{ matrix.network == 'meteohub' && secrets.METEOHUB_USERNAME || '' }}
          METEOHUB_PASSWORD: ${{ matrix.network == 'meteohub' && secrets.METEOHUB_PASSWORD || '' }}
          # Utilizza la nuova chiave WU che e' gia' operativa, non la vecchia personale.
          WU_APP_API_KEY: ${{ matrix.network == 'wunderground' && secrets.WU_APP_API_KEY || '' }}
          FORCE_UPDATE: ${{ github.event_name == 'workflow_dispatch' || github.event_name == 'push' }}
          NETWORK: ${{ matrix.network }}
        run: python "scripts/update_${NETWORK}.py"

      - name: Pubblica subito la rete aggiornata
        env:
          NETWORK: ${{ matrix.network }}
          DATA_FILE: data/${{ matrix.file }}.json
        run: |
          git config user.name "sardegna-meteolive-data-bot"
          git config user.email "actions@users.noreply.github.com"
          git add "$DATA_FILE"
          # Il collector WU scrive anche lo stato della chiave API: il file
          # va incluso nel commit, altrimenti git rebase fallisce con
          # "You have unstaged changes" e blocca la pubblicazione dei dati.
          if [ "$NETWORK" = "wunderground" ] && [ -f data/wunderground_app_api_health.json ]; then
            git add data/wunderground_app_api_health.json
          fi
          if git diff --cached --quiet; then
            echo "Nessuna variazione nei dati"
            exit 0
          fi
          git commit -m "Aggiorna osservazioni ${NETWORK}"
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git rebase origin/main
            if git push origin HEAD:main; then
              exit 0
            fi
            sleep "$attempt"
          done
          echo "Pubblicazione non riuscita dopo cinque tentativi" >&2
          exit 1
