name: Aggiorna reti MeteoHub, Aeronautica Militare ed Ecowitt

on:
  workflow_dispatch:
  # Weather Underground temporaneamente disattivata per scelta operativa.
  # Polling di MeteoHub DPCN e Aeronautica Militare, con recuperi indipendenti.
  # I collector rispettano intervalli minimi e orari reali delle osservazioni.
  # I workflow di backup dedicati e il watchdog coprono i ritardi cron.
  # Non concatenare ogni run con altri run: puo' generare code e cancellazioni.
  push:
    branches: [main]
    paths:
      - '.github/workflows/update-observations.yml'
  schedule:
    # Controlla ogni 5 minuti; MeteoHub conserva il proprio limite quota.
    # Gli altri collector verificano fonti disponibili a ogni ciclo.
    - cron: '*/5 * * * *'

permissions:
  contents: write

jobs:
  update:
    name: Aggiorna ${{ matrix.network }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - network: meteohub
            file: stations
          - network: am
            file: am
          # Percorso indipendente dal cron dedicato Ecowitt, soggetto a
          # ritardi best-effort. Mantiene i segreti su Actions.
          - network: ecowitt
            file: ecowitt
    # Stesso lock dei workflow manuali: niente doppie richieste alla stessa rete.
    concurrency:
      group: observations-${{ matrix.network }}
      cancel-in-progress: false
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Configura Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Aggiorna rete
        env:
          METEOHUB_USERNAME: ${{ matrix.network == 'meteohub' && secrets.METEOHUB_USERNAME || '' }}
          METEOHUB_PASSWORD: ${{ matrix.network == 'meteohub' && secrets.METEOHUB_PASSWORD || '' }}
          ECOWITT_APPLICATION_KEY: ${{ matrix.network == 'ecowitt' && secrets.ECOWITT_APPLICATION_KEY || '' }}
          ECOWITT_API_KEY: ${{ matrix.network == 'ecowitt' && secrets.ECOWITT_API_KEY || '' }}
          ECOWITT_DEVICE_MAC: ${{ matrix.network == 'ecowitt' && secrets.ECOWITT_DEVICE_MAC || '' }}
          # Anche il watchdog puo' avviare questo workflow: non deve
          # aggirare le quote minime dei provider.
          FORCE_UPDATE: ${{ github.event_name == 'push' }}
          NETWORK: ${{ matrix.network }}
        run: python "scripts/update_${NETWORK}.py"

      - name: Pubblica osservazioni evitando conflitti e vecchi snapshot
        if: matrix.network != 'meteohub'
        env:
          DATA_FILE: data/${{ matrix.file }}.json
        run: |
          set -e
          git config user.name "sardegna-meteolive-data-bot"
          git config user.email "actions@users.noreply.github.com"
          # Copia persistente nel runner, non soggetta ai reset del checkout.
          cp "$DATA_FILE" "$RUNNER_TEMP/station-update-candidate.json"
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git reset --hard origin/main
            # Mantieni il ramo snello: pubblica solo se cambiano dati o timestamp
            # reali delle singole osservazioni; gli orari di controllo da soli
            # non producono commit inutili.
            python - "$DATA_FILE" "$RUNNER_TEMP/station-update-candidate.json" <<'PY'
          import json,sys
          from pathlib import Path
          target,source=map(Path,sys.argv[1:3])
          new=json.loads(source.read_text(encoding="utf-8"))
          old=json.loads(target.read_text(encoding="utf-8")) if target.exists() else {}
          def signature(payload):
              value={k:v for k,v in payload.items() if k not in {"generated_at","checked_at"}}
              rows=[]
              for row in payload.get("stations",[]):
                  if not isinstance(row,dict): continue
                  rows.append({k:v for k,v in row.items() if k!="stale_min"})
              value["stations"]=sorted(rows,key=lambda row:str(row.get("station_id") or row.get("name") or ""))
              return value
          if signature(new)==signature(old):
              print("Nessuna nuova osservazione: evito di pubblicare un file invariato")
          else:
              target.write_bytes(source.read_bytes())
              print("Pubblicate nuove osservazioni:",new.get("generated_at"))
          PY
            git add "$DATA_FILE"
            if git diff --cached --quiet; then
              echo "Nessuna nuova osservazione da pubblicare"
              exit 0
            fi
            git commit -m "Aggiorna osservazioni rete"
            if git push origin HEAD:main; then
              echo "Osservazioni pubblicate correttamente"
              exit 0
            fi
            echo "Commit concorrente: aggiorno main e riprovo" >&2
            sleep "$attempt"
          done
          echo "ERRORE: dati acquisiti ma non pubblicati dopo cinque tentativi" >&2
          exit 1

      - name: Pubblica DPCN e MNW dalla stessa estrazione MeteoHub
        if: matrix.network == 'meteohub'
        run: bash scripts/publish_meteohub_combined.sh
