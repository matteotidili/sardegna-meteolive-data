name: Aggiorna reti MeteoHub, Aeronautica Militare ed Ecowitt

on:
  workflow_dispatch:
  # Weather Underground temporaneamente disattivata per scelta operativa.
  # Polling di MeteoHub DPCN e Aeronautica Militare, con recuperi indipendenti.
  # I collector rispettano intervalli minimi e orari reali delle osservazioni.
  workflow_run:
    workflows:
      - 'Aggiorna dati MeteoHub'
      - 'Aggiorna dati Aeronautica Militare'
      - 'Aggiorna allerte MeteoAlarm Mediterraneo'
      # Backup indipendenti: quando GitHub ritarda o perde gli eventi cron
      # principali, una qualunque di queste reti riattiva DPCN e AM.
      - 'Aggiorna rete WeatherLink (accesso autorizzato)'
      - 'Aggiorna pluviometri Sardegna CEDOC'
      - 'Aggiorna incendi MTG FRP'
      - 'Aggiorna vettori AROME 10m'
      - 'Calcola accumuli pluviometrici 48 ore da tutte le reti'
      - 'Aggiorna rete Ecowitt autorizzata'
    types: [completed]
  push:
    branches: [main]
    paths:
      - '.github/workflows/update-observations.yml'
  schedule:
    # Ogni 10 minuti; i trigger di altri workflow e backup restano attivi.
    # I singoli collector limitano le richieste API tramite checked_at.
    - cron: '4,14,24,34,44,54 * * * *'

permissions:
  contents: write

jobs:
  update:
    name: Aggiorna ${{ matrix.network }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - network: meteohub
            file: stations
          - network: am
            file: am
          # Percorso indipendente dal cron dedicato Ecowitt, soggetto a
          # ritardi best-effort. Mantiene i segreti su Actions.
          - network: ecowitt
            file: ecowitt
    # Stesso lock dei workflow manuali: niente doppie richieste alla stessa rete.
    concurrency:
      group: observations-${{ matrix.network }}
      cancel-in-progress: false
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Configura Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Aggiorna rete
        env:
          METEOHUB_USERNAME: ${{ matrix.network == 'meteohub' && secrets.METEOHUB_USERNAME || '' }}
          METEOHUB_PASSWORD: ${{ matrix.network == 'meteohub' && secrets.METEOHUB_PASSWORD || '' }}
          ECOWITT_APPLICATION_KEY: ${{ matrix.network == 'ecowitt' && secrets.ECOWITT_APPLICATION_KEY || '' }}
          ECOWITT_API_KEY: ${{ matrix.network == 'ecowitt' && secrets.ECOWITT_API_KEY || '' }}
          ECOWITT_DEVICE_MAC: ${{ matrix.network == 'ecowitt' && secrets.ECOWITT_DEVICE_MAC || '' }}
          FORCE_UPDATE: ${{ github.event_name == 'workflow_dispatch' || github.event_name == 'push' }}
          NETWORK: ${{ matrix.network }}
        run: python "scripts/update_${NETWORK}.py"

      - name: Pubblica osservazioni evitando conflitti e vecchi snapshot
        env:
          DATA_FILE: data/${{ matrix.file }}.json
        run: |
          set -e
          git config user.name "sardegna-meteolive-data-bot"
          git config user.email "actions@users.noreply.github.com"
          # Copia persistente nel runner, non soggetta ai reset del checkout.
          cp "$DATA_FILE" "$RUNNER_TEMP/station-update-candidate.json"
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git reset --hard origin/main
            # Non sovrascrivere un dato piu' recente pubblicato da un altro job.
            # Scrivi il file soltanto se la nuova osservazione e/o acquisizione
            # e' successiva a quanto gia' presente nel branch main.
            python - "$DATA_FILE" "$RUNNER_TEMP/station-update-candidate.json" <<'PY'
          import json,sys
          from datetime import datetime,timezone
          from pathlib import Path
          target,source=map(Path,sys.argv[1:3])
          new=json.loads(source.read_text(encoding="utf-8"))
          old=json.loads(target.read_text(encoding="utf-8")) if target.exists() else {}
          def ts(value):
              try:
                  v=datetime.fromisoformat(str(value).replace("Z","+00:00"))
                  return v.astimezone(timezone.utc) if v.tzinfo else v.replace(tzinfo=timezone.utc)
              except (ValueError,TypeError):
                  return datetime.min.replace(tzinfo=timezone.utc)
          nk=(ts(new.get("generated_at")),ts(new.get("checked_at")))
          ok=(ts(old.get("generated_at")),ts(old.get("checked_at")))
          if nk<=ok:
              print("Gia' pubblicato un dataset equivalente o piu' recente: niente sovrascrittura")
          else:
              source_bytes=source.read_bytes()
              target.write_bytes(source_bytes)
              print("Pronto nuovo dataset: osservazione",new.get("generated_at"),
                    "acquisizione",new.get("checked_at"))
          PY
            git add "$DATA_FILE"
            if git diff --cached --quiet; then
              echo "Nessuna nuova osservazione da pubblicare"
              exit 0
            fi
            git commit -m "Aggiorna osservazioni rete"
            if git push origin HEAD:main; then
              echo "Osservazioni pubblicate correttamente"
              exit 0
            fi
            echo "Commit concorrente: aggiorno main e riprovo" >&2
            sleep "$attempt"
          done
          echo "ERRORE: dati acquisiti ma non pubblicati dopo cinque tentativi" >&2
          exit 1
