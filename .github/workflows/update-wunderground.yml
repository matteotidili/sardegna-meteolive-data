name: Aggiorna dati Weather Underground

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/update_wunderground.py'
      - '.github/workflows/update-wunderground.yml'
  schedule:
    - cron: '8,38 * * * *'

permissions:
  contents: write

concurrency:
  group: observations-wu
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configura Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Scarica ed elabora Weather Underground
        env:
          WU_API_KEY: ${{ secrets.WU_API_KEY }}
          FORCE_UPDATE: ${{ github.event_name == 'workflow_dispatch' }}
        run: python scripts/update_wunderground.py

      - name: Pubblica il JSON aggiornato
        run: |
          git config user.name "sardegna-meteolive-data-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/wunderground.json
          if git diff --cached --quiet; then
            echo "Nessuna variazione nei dati"
            exit 0
          fi
          git commit -m "Aggiorna osservazioni Weather Underground"
          git pull --rebase
          git push
