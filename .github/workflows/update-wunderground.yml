name: Aggiorna dati Weather Underground
# Aggiornamento completo delle stazioni WU, max una scansione ogni 29+ minuti.
# Il workflow viene richiamato più spesso per resilienza del cron GitHub.

on:
  workflow_dispatch:
  # Due trigger indipendenti dal cron WU riducono i buchi del pianificatore.
  # Lo script salta automaticamente gli avvii prima dei 29 minuti.
  workflow_run:
    workflows:
      - 'Aggiorna pluviometri Sardegna CEDOC'
      - 'Aggiorna rete WeatherLink (accesso autorizzato)'
      - 'Aggiorna vettori AROME 10m'
      - 'Calcola accumuli pluviometrici 48 ore da tutte le reti'
    types: [completed]
  # Consente di avviare un controllo reale quando viene aggiornata la
  # configurazione di questo workflow; nessun trigger sui dati osservativi.
  push:
    branches: [main]
    paths:
      - '.github/workflows/update-wunderground.yml'
  # Interroga tutta la rete nello stesso ciclo. Attenzione: 333 PWS × 48 cicli
  # = 15984 richieste/giorno; la quota concessa dal provider deve permetterlo.
  # Il collector mantiene i controlli sui codici HTTP 401/403/429.
  schedule:
    # Più occasioni di attivazione contro i cron GitHub saltati; il collector
    # fa realmente una sola acquisizione completa ogni >=29 minuti.
    - cron: '3,13,23,33,43,53 * * * *'
  # Le modifiche al codice non generano richieste extra. Soltanto modifiche
  # al workflow, schedulazione e trigger di backup avviano il job.
permissions:
  contents: write

concurrency:
  group: observations-wunderground
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configura Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Scarica ed elabora Weather Underground
        env:
          WU_APP_API_KEY: ${{ secrets.WU_APP_API_KEY }}
          # Nessuna rotazione: richiesta dell'intero inventario a ogni ciclo.
          # Solo avvio manuale forza la scansione. Modifiche al workflow
          # non duplicano 304 chiamate mentre un altro ciclo è già in corso.
          FORCE_UPDATE: ${{ github.event_name == 'workflow_dispatch' }}
        run: python scripts/update_wunderground.py

      - name: Pubblica il JSON aggiornato
        run: |
          git config user.name "sardegna-meteolive-data-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/wunderground.json
          if [ -f data/wunderground_app_api_health.json ]; then
            git add data/wunderground_app_api_health.json
          fi
          if git diff --cached --quiet; then
            echo "Nessuna variazione nei dati"
            exit 0
          fi
          git commit -m "Aggiorna osservazioni Weather Underground"
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git rebase -X theirs origin/main
            if git push origin HEAD:main; then exit 0; fi
            sleep "$attempt"
          done
          exit 1
