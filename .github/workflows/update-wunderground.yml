name: Aggiorna dati Weather Underground
# Inventario WU adattivo

on:
  workflow_dispatch:
  # Rete WU acquisita a blocchi da 24 stazioni; evita l'intero
  # inventario di 333 richieste ogni 5 minuti.
  schedule:
    - cron: '13,33,53 * * * *'
  # Nessun trigger su push: le modifiche al codice non devono generare
  # richieste extra a una API già in limitazione di quota.
permissions:
  contents: write

concurrency:
  group: observations-wunderground
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configura Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Scarica ed elabora Weather Underground
        env:
          WU_API_KEY: ${{ secrets.WU_API_KEY }}
          FORCE_UPDATE: ${{ github.event_name == 'workflow_dispatch' }}
        run: python scripts/update_wunderground.py

      - name: Pubblica il JSON aggiornato
        run: |
          git config user.name "sardegna-meteolive-data-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/wunderground.json
          if [ -f data/wunderground_api_health.json ]; then
            git add data/wunderground_api_health.json
          fi
          if git diff --cached --quiet; then
            echo "Nessuna variazione nei dati"
            exit 0
          fi
          git commit -m "Aggiorna osservazioni Weather Underground"
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git rebase -X theirs origin/main
            if git push origin HEAD:main; then exit 0; fi
            sleep "$attempt"
          done
          exit 1
