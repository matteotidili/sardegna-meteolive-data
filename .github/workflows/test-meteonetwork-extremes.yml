name: Test estremi MeteoNetwork
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/update_meteonetwork_hub.py'
      - 'tests/test_meteonetwork_names.py'
      - '.github/workflows/test-meteonetwork-extremes.yml'
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Testa estremi e identità stazioni MeteoNetwork
        run: python -m unittest discover -s tests -p 'test_meteonetwork_names.py' -v
