name: Aggiorna dati Aeronautica Militare

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/update_am.py'
      - '.github/workflows/update-am.yml'
  schedule:
    - cron: '7,37 * * * *'

permissions:
  contents: write

concurrency:
  group: observations-am
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configura Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Scarica ed elabora SYNOP AM
        run: python scripts/update_am.py

      - name: Pubblica il JSON aggiornato
        run: |
          git config user.name "sardegna-meteolive-data-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/am.json
          if git diff --cached --quiet; then
            echo "Nessuna variazione nei dati"
            exit 0
          fi
          git commit -m "Aggiorna osservazioni Aeronautica Militare"
          if ! git push; then
            git fetch origin main
            git rebase -X theirs origin/main
            git push
          fi
