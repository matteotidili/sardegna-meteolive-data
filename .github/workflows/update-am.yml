name: Aggiorna dati Aeronautica Militare
# Raccolta indipendente e di riserva rispetto al workflow comune MeteoHub/AM.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/update_am.py'
      - '.github/workflows/update-am.yml'
  schedule:
    - cron: '2,12,22,32,42,52 * * * *'
permissions:
  contents: write

concurrency:
  group: observations-am
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configura Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Scarica ed elabora SYNOP AM
        env:
          FORCE_UPDATE: ${{ github.event_name == 'workflow_dispatch' || github.event_name == 'push' }}
        run: python scripts/update_am.py

      - name: Pubblica il JSON aggiornato
        run: |
          git config user.name "sardegna-meteolive-data-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/am.json
          if git diff --cached --quiet; then
            echo "Nessuna variazione nei dati"
            exit 0
          fi
          git commit -m "Aggiorna osservazioni Aeronautica Militare"
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git rebase origin/main
            if git push origin HEAD:main; then exit 0; fi
            sleep "$attempt"
          done
          echo "Pubblicazione AM fallita" >&2
          exit 1
          fi
