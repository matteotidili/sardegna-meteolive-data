name: Aggiorna MeteoProject Cagliari
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: observations-meteoproject
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Acquisisci Cagliari Liceo Euclide
        run: python scripts/update_meteoproject.py
      - name: Pubblica JSON se aggiornato
        run: |
          git config user.name "sardegna-meteolive-data-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/meteoproject.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Aggiorna osservazioni MeteoProject"
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git rebase origin/main
            if git push origin HEAD:main; then exit 0; fi
            sleep "$attempt"
          done
          exit 1
