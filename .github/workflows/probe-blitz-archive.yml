name: Probe Blitz archive form
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/probe-blitz-archive.yml'
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Read public archive form
        shell: bash
        run: |
          set -e
          curl -fsSL 'https://www.blitzortung.org/en/archive_data.php' -o /tmp/a.html
          echo '=== UNIQUE FIELD NAMES ==='
          grep -oEi '<(input|select)[^>]*name="[^"]+"' /tmp/a.html | sed -E 's/.*name="([^"]+)".*/\1/' | sort -u
          echo '=== FORM ACTION ==='
          grep -oEi '<form[^>]*>' /tmp/a.html | head -5
          echo '=== INPUTS ==='
          grep -oEi '<input[^>]*name="[^"]+"[^>]*>' /tmp/a.html | head -120
          echo '=== JS REFS ==='
          grep -nEi 'make_maps|archive_data|parameter_file|submit|gif|frames|north|south|west|east|end_time|start_time|time_span' /tmp/a.html | head -220
