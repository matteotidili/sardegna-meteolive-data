name: Verifica sorgente MeteoNetwork via MeteoHub
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/probe_meteonetwork.py'
      - '.github/workflows/probe-meteonetwork.yml'
permissions:
  contents: read
concurrency:
  group: observations-meteohub
  cancel-in-progress: false
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Testa acquisizione senza pubblicare o modificare DPCN
        env:
          METEOHUB_USERNAME: ${{ secrets.METEOHUB_USERNAME }}
          METEOHUB_PASSWORD: ${{ secrets.METEOHUB_PASSWORD }}
        run: python scripts/probe_meteonetwork.py
