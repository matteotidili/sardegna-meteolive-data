name: Verifica AROME HD Météo-France
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/inspect_arome_hd.py
      - .github/workflows/inspect-arome-hd.yml
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
      - name: Installa ecCodes
        run: python3 -m pip install --disable-pip-version-check eccodes numpy
      - name: Diagnostica GRIB2 AROME HD
        run: python3 scripts/inspect_arome_hd.py
