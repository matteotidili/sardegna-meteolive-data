name: Aggiorna dati MeteoHub

on:
  workflow_dispatch:
  # Backup DPCN ogni 30 minuti, sfalsato rispetto a quella
  # generale (update-observations.yml, minuti 4/19/34/49). I trigger
  # schedule sono best-effort: calendari ridondanti riducono i buchi.
  # update_meteohub.py mantiene un intervallo minimo di 12 minuti
  # tra richieste effettive MeteoHub (quota predefinita 10/ora).
  schedule:
    - cron: '11,41 * * * *'
  push:
    branches: [main]
    paths:
      - 'scripts/update_meteohub.py'
      - 'scripts/update_meteonetwork_hub.py'
      - '.github/workflows/update-meteohub.yml'
permissions:
  contents: write

concurrency:
  group: observations-meteohub
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configura Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Disattiva e verifica subito le email di successo MeteoHub
        if: github.event_name == 'push'
        env:
          METEOHUB_USERNAME: ${{ secrets.METEOHUB_USERNAME }}
          METEOHUB_PASSWORD: ${{ secrets.METEOHUB_PASSWORD }}
          PYTHONPATH: scripts
        run: python -c 'from update_meteohub import login; login()'

      - name: Scarica ed elabora MeteoHub
        env:
          METEOHUB_USERNAME: ${{ secrets.METEOHUB_USERNAME }}
          METEOHUB_PASSWORD: ${{ secrets.METEOHUB_PASSWORD }}
          FORCE_UPDATE: ${{ github.event_name == 'workflow_dispatch' }}
        run: python scripts/update_meteohub.py

      - name: Pubblica insieme DPCN e MeteoNetwork dalla stessa estrazione
        run: bash scripts/publish_meteohub_combined.sh
