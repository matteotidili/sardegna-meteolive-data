name: Aggiorna dati MeteoHub

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/update_meteohub.py'
      - '.github/workflows/update-meteohub.yml'
  schedule:
    # Fallback ridondante; il workflow combinato gira più spesso.
    - cron: '7,37 * * * *'

permissions:
  contents: write

concurrency:
  group: observations-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configura Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Scarica ed elabora MeteoHub
        env:
          METEOHUB_USERNAME: ${{ secrets.METEOHUB_USERNAME }}
          METEOHUB_PASSWORD: ${{ secrets.METEOHUB_PASSWORD }}
          FORCE_UPDATE: ${{ github.event_name == 'workflow_dispatch' }}
        run: python scripts/update_meteohub.py

      - name: Pubblica il JSON aggiornato
        run: |
          git config user.name "sardegna-meteolive-data-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/stations.json
          if git diff --cached --quiet; then
            echo "Nessuna variazione nei dati"
            exit 0
          fi
          git commit -m "Aggiorna osservazioni MeteoHub"
          if ! git push; then
            git fetch origin main
            git rebase -X theirs origin/main
            git push
          fi
