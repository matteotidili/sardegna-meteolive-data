name: Aggiorna dati MeteoHub

on:
  workflow_dispatch:
  # Pianificazione DPCN dedicata, sfalsata di 2 minuti rispetto a quella
  # generale (update-observations.yml, minuti 4/9/14/...). I trigger
  # schedule sono best-effort: due calendari riducono i buchi di esecuzione.
  # update_meteohub.py mantiene un intervallo minimo di 7 minuti
  # tra richieste effettive MeteoHub (quota predefinita 10/ora).
  schedule:
    - cron: '1,6,11,16,21,26,31,36,41,46,51,56 * * * *'
  push:
    branches: [main]
    paths:
      - 'scripts/update_meteohub.py'
      - '.github/workflows/update-meteohub.yml'
permissions:
  contents: write

concurrency:
  group: observations-meteohub
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configura Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Scarica ed elabora MeteoHub
        env:
          METEOHUB_USERNAME: ${{ secrets.METEOHUB_USERNAME }}
          METEOHUB_PASSWORD: ${{ secrets.METEOHUB_PASSWORD }}
          FORCE_UPDATE: ${{ github.event_name == 'workflow_dispatch' }}
        run: python scripts/update_meteohub.py

      - name: Pubblica il JSON aggiornato
        run: |
          git config user.name "sardegna-meteolive-data-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/stations.json
          if git diff --cached --quiet; then
            echo "Nessuna variazione nei dati"
            exit 0
          fi
          git commit -m "Aggiorna osservazioni MeteoHub"
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git rebase origin/main
            if git push origin HEAD:main; then exit 0; fi
            sleep "$attempt"
          done
          echo "Pubblicazione MeteoHub fallita" >&2
          exit 1
          fi
