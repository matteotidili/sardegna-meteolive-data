name: Probe EUMETSAT LI

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/probe-eumetsat-li.yml'

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Verifica WMS LI
        shell: bash
        run: |
          set -euo pipefail
          BASE='https://view.eumetsat.int/geoserver/wms'
          echo '=== capabilities layer ==='
          curl -fsSL "$BASE?service=WMS&version=1.1.1&request=GetCapabilities" -o /tmp/cap.xml
          grep -oEi '<Name>[^<]*li_afa[^<]*</Name>|<Title>[^<]*Accumulated Flash Area[^<]*</Title>' /tmp/cap.xml | head -20 || true

          echo '=== legend ==='
          curl -sS -L -o /tmp/legend.png -w '%{http_code} %{size_download} %{content_type}\n' "$BASE?service=WMS&request=GetLegendGraphic&version=1.1.1&format=image/png&layer=mtg_fd:li_afa" || true
          file /tmp/legend.png || true

          echo '=== probe recent frames ==='
          python - <<'PY'
          from datetime import datetime, timezone, timedelta
          import subprocess, os
          base='https://view.eumetsat.int/geoserver/wms'
          now=datetime.now(timezone.utc)
          now=now.replace(second=0,microsecond=0,minute=(now.minute//5)*5)
          for i in range(0,13):
              d=now-timedelta(minutes=5*i)
              iso=d.isoformat().replace('+00:00','Z')
              q=(
                  f'{base}?service=WMS&request=GetMap&version=1.1.1'
                  f'&layers=mtg_fd:li_afa&styles=&format=image/png&transparent=true'
                  f'&srs=EPSG:4326&bbox=-12,28,35,48&width=640&height=320'
                  f'&time={iso}'
              )
              out='/tmp/li.png'
              p=subprocess.run(['curl','-sS','-L','-o',out,'-w','%{http_code} %{size_download} %{content_type}',q],capture_output=True,text=True)
              print(iso,p.stdout)
              if p.stdout.startswith('200 ') and os.path.getsize(out)>2000:
                  print('FOUND',iso)
                  break
          PY
