name: Aggiorna pluviometri Sardegna CEDOC

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/update_cedoc.py'
      - '.github/workflows/update-cedoc.yml'
  schedule:
    # Una raccolta ogni 30 minuti, dopo i consueti aggiornamenti del portale.
    - cron: '12,42 * * * *'

permissions:
  contents: write

concurrency:
  group: cedoc-rainfall-half-hourly
  cancel-in-progress: true

jobs:
  cedoc:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Installazione parser HTML
        run: python -m pip install --disable-pip-version-check 'requests>=2.31,<3' 'beautifulsoup4>=4.12,<5'
      - name: Leggi rete pubblica con controllo freschezza
        run: |
          python -m py_compile scripts/update_cedoc.py
          python scripts/update_cedoc.py
      - name: Valida metadati e coordinate
        run: |
          python - <<'PY'
          import json, datetime as dt
          from pathlib import Path
          data=json.loads(Path('data/cedoc.json').read_text(encoding='utf-8'))
          assert data['parameter']=='rain_today' and data['refresh_minutes']==30
          assert data['status'] in {'ok','unavailable','stale'}
          assert data['station_count']==len(data['stations'])
          for s in data['stations']:
              assert 38.6<=s['lat']<=41.5 and 7.5<=s['lon']<=10.4
              assert 0<=s['rain_today']<=1800
              assert s['source_url'].startswith('https://www.sardegnacedoc.it/idrografico/sensore/')
              assert dt.datetime.fromisoformat(s['last'].replace('Z','+00:00')).tzinfo
              assert s['observed_day']==data['local_day']
          if data['status']!='ok':
              assert not data['stations'], 'A stale or unavailable dataset must never show rain values'
          print('CEDOC', data['status'], data['station_count'], 'stazioni con dato recente')
          PY
      - name: Pubblica stato e misure senza conflitti con gli altri updater
        run: |
          set -e
          git config user.name 'sardegna-meteolive-data-bot'
          git config user.email 'actions@users.noreply.github.com'
          cp data/cedoc.json "$RUNNER_TEMP/cedoc-pending.json"
          if [ -f data/cedoc_sensors.json ]; then
            cp data/cedoc_sensors.json "$RUNNER_TEMP/cedoc-sensors-pending.json"
          fi
          for attempt in 1 2 3 4 5; do
            # Non effettuare rebase su file appena generati: lo stesso JSON
            # può essere stato pubblicato da un altro workflow nel frattempo.
            git fetch origin main
            git reset --hard origin/main
            # Un run più vecchio non può sovrascrivere osservazioni nuove.
            if ! python - "$RUNNER_TEMP/cedoc-pending.json" data/cedoc.json <<'PY'
          import json, sys
          from pathlib import Path
          candidate=json.loads(Path(sys.argv[1]).read_text(encoding='utf-8'))
          existing_path=Path(sys.argv[2])
          if existing_path.exists():
              existing=json.loads(existing_path.read_text(encoding='utf-8'))
              candidate_time=candidate.get('source_time')
              existing_time=existing.get('source_time')
              if candidate_time and existing_time and existing_time > candidate_time:
                  print('CEDOC: dataset pubblicato più recente, salto aggiornamento obsoleto')
                  sys.exit(1)
          PY
            then
              exit 0
            fi
            cp "$RUNNER_TEMP/cedoc-pending.json" data/cedoc.json
            if [ -f "$RUNNER_TEMP/cedoc-sensors-pending.json" ]; then
              cp "$RUNNER_TEMP/cedoc-sensors-pending.json" data/cedoc_sensors.json
            fi
            git add data/cedoc.json
            if [ -f data/cedoc_sensors.json ]; then git add data/cedoc_sensors.json; fi
            if git diff --cached --quiet; then exit 0; fi
            git commit -m 'Aggiorna CEDOC pluviometri giornalieri'
            if git push origin HEAD:main; then exit 0; fi
            sleep "$attempt"
          done
          exit 1
