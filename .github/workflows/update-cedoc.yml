name: Aggiorna pluviometri Sardegna CEDOC

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/update_cedoc.py'
      - '.github/workflows/update-cedoc.yml'
  schedule:
    # Una richiesta moderata alla directory pubblica e ai punti, circa ogni ora.
    - cron: '18 * * * *'

permissions:
  contents: write

concurrency:
  group: cedoc-rainfall-hourly
  cancel-in-progress: false

jobs:
  cedoc:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Installazione parser HTML
        run: python -m pip install --disable-pip-version-check 'requests>=2.31,<3' 'beautifulsoup4>=4.12,<5'
      - name: Leggi rete pubblica con controllo freschezza
        run: python scripts/update_cedoc.py
      - name: Valida metadati e coordinate
        run: |
          python - <<'PY'
          import json, datetime as dt
          from pathlib import Path
          data=json.loads(Path('data/cedoc.json').read_text(encoding='utf-8'))
          assert data['accumulation_hours']==48
          assert data['status'] in {'ok','unavailable','stale'}
          assert data['station_count']==len(data['stations'])
          for s in data['stations']:
              assert 38.6<=s['lat']<=41.5 and 7.5<=s['lon']<=10.4
              assert 0<=s['rain_48h']<=1800
              assert s['source_url'].startswith('https://www.sardegnacedoc.it/idrografico/stazione/')
              assert dt.datetime.fromisoformat(s['last'].replace('Z','+00:00')).tzinfo
          if data['status']!='ok':
              assert not data['stations'], 'A stale or unavailable dataset must never show rain values'
          print('CEDOC', data['status'], data['station_count'], 'stazioni con dato recente')
          PY
      - name: Pubblica stato e misure
        run: |
          git config user.name 'sardegna-meteolive-data-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add data/cedoc.json
          git diff --cached --quiet && exit 0
          git commit -m 'Aggiorna monitoraggio CEDOC accumuli 48h'
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git rebase origin/main
            if git push origin HEAD:main; then exit 0; fi
            sleep "$attempt"
          done
          exit 1
