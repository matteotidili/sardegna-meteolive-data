name: Aggiorna pluviometri Sardegna CEDOC

on:
  workflow_dispatch:
    inputs:
      publish:
        description: Pubblica sul ramo principale dopo la validazione
        type: boolean
        default: true
  push:
    branches: [main]
    paths:
      - 'scripts/update_cedoc.py'
      - '.github/workflows/update-cedoc.yml'
      - 'tests/test_cedoc_catalog.py'
  schedule:
    # Una scansione completa per esecuzione. Actions può avviare il job in ritardo.
    - cron: '13,43 * * * *'

permissions:
  contents: read

concurrency:
  group: cedoc-rainfall
  cancel-in-progress: false

jobs:
  cedoc:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      CEDOC_WORKERS: '4'
      CEDOC_REQUEST_INTERVAL: '0.75'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Installa il parser e verifica le regressioni
        run: |
          python -m pip install --disable-pip-version-check 'requests>=2.31,<3' 'beautifulsoup4>=4.12,<5'
          python -m unittest discover -s tests -p 'test_cedoc_catalog.py' -v
      - name: Acquisisci e valida tutte le letture CEDOC
        run: |
          python scripts/update_cedoc.py | tee -a "$GITHUB_STEP_SUMMARY"
          python scripts/update_cedoc.py --validate
      - name: Salva i dati per la verifica
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: cedoc-validated
          path: data/cedoc*.json
      - name: Pubblica il dataset validato
        if: github.ref_name == 'main' && (github.event_name != 'workflow_dispatch' || inputs.publish)
        run: |
          git config user.name 'sardegna-meteolive-data-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add data/cedoc*.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Aggiorna osservazioni e copertura CEDOC'
          for attempt in 1 2 3 4 5; do
            git fetch --depth=50 origin main
            # Un conflitto sui file CEDOC interrompe il deploy, mentre gli updater
            # delle altre reti possono pubblicare durante la scansione.
            git rebase origin/main
            if git push origin HEAD:main; then exit 0; fi
            sleep "$attempt"
          done
          exit 1
