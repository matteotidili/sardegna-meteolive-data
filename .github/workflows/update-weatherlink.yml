name: Aggiorna rete WeatherLink (accesso autorizzato)
on:
  workflow_dispatch:
  schedule:
    - cron: '7,37 * * * *'
permissions:
  contents: write
concurrency:
  group: observations-weatherlink
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Acquisisci solo stazioni autorizzate
        env:
          WEATHERLINK_API_KEY: ${{ secrets.WEATHERLINK_API_KEY }}
          WEATHERLINK_API_SECRET: ${{ secrets.WEATHERLINK_API_SECRET }}
        run: python scripts/update_weatherlink.py
      - name: Pubblica JSON se aggiornato
        run: |
          git config user.name "sardegna-meteolive-data-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/weatherlink.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Aggiorna osservazioni WeatherLink"
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git rebase origin/main
            if git push origin HEAD:main; then exit 0; fi
            sleep "$attempt"
          done
          exit 1
