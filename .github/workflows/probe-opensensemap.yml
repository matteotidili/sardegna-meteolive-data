name: Verifica sensori openSenseMap Sardegna
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/probe_opensensemap.py'
      - '.github/workflows/probe-opensensemap.yml'
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Valuta copertura e dati recenti senza alterare la web app
        run: python scripts/probe_opensensemap.py
