name: Aggiorna frame satellite EUMETSAT

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-satellite-eumetsat
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configura Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Legge ultimo frame disponibile
        run: python scripts/update_satellite_eumetsat.py

      - name: Pubblica metadata satellite
        run: |
          git config user.name "sardegna-meteolive-data-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/satellite_eumetsat.json
          if git diff --cached --quiet; then
            echo "Nessun nuovo frame"
            exit 0
          fi
          git commit -m "Aggiorna frame satellite EUMETSAT"
          git pull --rebase
          git push
