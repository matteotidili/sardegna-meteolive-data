name: Scopri stazioni Weather Underground

on:
  workflow_dispatch:
  # 12 interrogazioni al giorno, non migliaia per singola scansione.
  schedule:
    - cron: '17 4 * * *'

permissions:
  contents: write

concurrency:
  group: observations-wunderground
  cancel-in-progress: false

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configura Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Scopri PWS in Sardegna
        env:
          WU_API_KEY: ${{ secrets.WU_API_KEY }}
        run: python scripts/discover_wunderground.py

      - name: Salva elenco stazioni
        run: |
          git config user.name "sardegna-meteolive-data-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/wunderground_stations.json
          if [ -f data/wunderground_api_health.json ]; then
            git add data/wunderground_api_health.json
          fi
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Ricerca incrementale PWS Weather Underground"
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git rebase -X theirs origin/main
            if git push origin HEAD:main; then exit 0; fi
            sleep "$attempt"
          done
          exit 1
