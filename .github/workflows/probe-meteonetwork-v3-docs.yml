name: Sonda documentazione API MeteoNetwork (temporanea)
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/probe_meteonetwork_v3_docs.py'
      - '.github/workflows/probe-meteonetwork-v3-docs.yml'
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install PyYAML
      - run: python scripts/probe_meteonetwork_v3_docs.py
