name: Debug MeteoAlarm upcoming candidates

on:
  push:
    branches: [debug/meteoalarm-upcoming-map]
    paths:
      - '.github/workflows/debug-meteoalarm-upcoming.yml'

permissions:
  contents: read

jobs:
  debug:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Conta feature future
        run: |
          python - <<'PY'
          import json, urllib.request, urllib.parse
          from datetime import datetime, timezone, timedelta
          from pathlib import Path

          BASE="https://visservice.meteoalarm.org"
          now=datetime.now(timezone.utc)
          headers={"User-Agent":"Mozilla/5.0","Accept":"application/json,*/*"}

          def parse(s):
              return datetime.fromisoformat(s.replace("Z","+00:00"))
          def frames(ref):
              q=urllib.parse.urlencode({"referenceDate":ref.isoformat(timespec="milliseconds").replace("+00:00","Z"),"preset":"now"})
              req=urllib.request.Request(f"{BASE}/api/v1/stream-buffers/live/frames?{q}",headers=headers)
              with urllib.request.urlopen(req,timeout=30) as r:
                  return json.loads(r.read().decode())["frames"]

          data=json.loads(Path("data/meteoalarm.json").read_text())
          onsets=sorted({
              parse(w.get("onset") or w.get("effective"))
              for w in data.get("warnings",[])
              if w.get("status")=="upcoming" and (w.get("onset") or w.get("effective"))
          })
          current=frames(now)
          current_ids={r["featureId"] for r in current if r.get("featureId")}
          all_future=set(); new_future=set(); changed=set()
          current_sig={(r.get("featureId"),r.get("typeId"),r.get("levelId")) for r in current}
          samples=[]
          for onset in onsets:
              ref=onset+timedelta(minutes=1)
              fr=frames(ref)
              ids={r["featureId"] for r in fr if r.get("featureId")}
              sig={(r.get("featureId"),r.get("typeId"),r.get("levelId")) for r in fr}
              all_future |= ids
              new_future |= ids-current_ids
              changed |= {a for a in sig-current_sig if a[0]}
              samples.append((ref.isoformat(),len(fr),len(ids-current_ids),len(sig-current_sig)))
          print("ONSETS",len(onsets))
          print("CURRENT_IDS",len(current_ids))
          print("FUTURE_IDS",len(all_future))
          print("NEW_IDS",len(new_future))
          print("CHANGED_SIGS",len(changed))
          print("SAMPLES",samples)
          PY
