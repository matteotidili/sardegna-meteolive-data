name: Debug MeteoAlarm upcoming presets

on:
  push:
    branches: [debug/meteoalarm-upcoming-map]
    paths:
      - '.github/workflows/debug-meteoalarm-upcoming.yml'

permissions:
  contents: read

jobs:
  debug:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test future presets
        run: |
          python - <<'PY'
          import json, urllib.request, urllib.parse
          from datetime import datetime, timezone
          BASE="https://visservice.meteoalarm.org"
          ref=datetime.now(timezone.utc).isoformat(timespec="milliseconds").replace("+00:00","Z")
          headers={"User-Agent":"Mozilla/5.0","Accept":"application/json,*/*"}
          def get(url):
              req=urllib.request.Request(url,headers=headers)
              with urllib.request.urlopen(req,timeout=30) as r:
                  return r.status,r.read().decode("utf-8","replace")
          for preset in ["now","today","tomorrow","day-after-tomorrow","next24h","next48h"]:
              q=urllib.parse.urlencode({"referenceDate":ref,"preset":preset})
              url=f"{BASE}/api/v1/stream-buffers/live/frames?{q}"
              try:
                  st,body=get(url)
                  data=json.loads(body)
                  frames=data.get("frames",[])
                  its=[x for x in frames if x.get("featureId")]
                  print("PRESET",preset,"STATUS",st,"FRAMES",len(its),"LEVELS",{str(k):sum(1 for x in its if x.get("levelId")==k) for k in (1,2,3)},"KEYS",list(data.keys()))
                  print("SAMPLE",preset,json.dumps(its[:3]))
              except Exception as e:
                  print("PRESET_ERR",preset,type(e).__name__,str(e))
          PY
