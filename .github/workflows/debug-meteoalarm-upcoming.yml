name: Debug MeteoAlarm upcoming

on:
  push:
    branches: [debug/meteoalarm-upcoming-map]
    paths:
      - '.github/workflows/debug-meteoalarm-upcoming.yml'

permissions:
  contents: read

jobs:
  debug:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test future frame Sardegna
        run: |
          python - <<'PY'
          import json, urllib.request, urllib.parse, math, gzip, subprocess, sys
          subprocess.check_call([sys.executable,"-m","pip","install","-q","mapbox-vector-tile"])
          import mapbox_vector_tile

          BASE="https://visservice.meteoalarm.org"
          ref="2026-10-08T10:00:00.000Z"
          params={"referenceDate":ref,"preset":"now"}
          q=urllib.parse.urlencode(params)
          headers={"User-Agent":"Mozilla/5.0","Accept":"application/json,application/vnd.mapbox-vector-tile,*/*","Accept-Encoding":"gzip"}

          def get(url):
              req=urllib.request.Request(url,headers=headers)
              with urllib.request.urlopen(req,timeout=30) as r:
                  raw=r.read()
                  if (r.headers.get("Content-Encoding") or "").lower()=="gzip" or raw[:2]==b"\x1f\x8b":
                      raw=gzip.decompress(raw)
                  return raw

          frames=json.loads(get(f"{BASE}/api/v1/stream-buffers/live/frames?{q}").decode("utf-8")).get("frames",[])
          print("FRAMES_TOTAL",len(frames))
          future=[x for x in frames if x.get("featureId")]
          print("LEVEL_COUNTS", {str(level):sum(1 for x in future if x.get("levelId")==level) for level in (1,2,3)})

          z=5
          lon,lat=9.0,40.0
          n=2**z
          x=int((lon+180)/360*n)
          y=int((1-math.asinh(math.tan(math.radians(lat)))/math.pi)/2*n)
          tile=mapbox_vector_tile.decode(get(f"{BASE}/stream-buffers/live/tiles/{z}/{x}/{y}.mvt?{q}"),default_options={"y_coord_down":True})
          areas=tile.get("areas",{}).get("features",[])
          print("AREAS",len(areas))
          for a in areas:
              p=a.get("properties") or {}
              if p.get("region_code")=="IT":
                  fid=p.get("uuid")
                  rows=[r for r in frames if r.get("featureId")==fid]
                  if rows:
                      print("IT_AREA",json.dumps({"uuid":fid,"fidd":p.get("fidd"),"rows":rows},ensure_ascii=False))
          PY
