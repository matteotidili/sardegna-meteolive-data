name: Verifica fonte Tmax Cagliari-Elmas
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/probe_elmas_tmax.py'
      - '.github/workflows/probe-elmas-tmax.yml'
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Elenca temperature e bollettini di origine senza modificare stazioni
        env:
          PYTHONPATH: scripts
        run: python scripts/probe_elmas_tmax.py
