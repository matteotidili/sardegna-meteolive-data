name: Verifica fonte quota altimetrica stazioni
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/probe-station-elevation.yml'
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Interroga DTM regionale WMS e sorgente altimetrica di fallback
        run: |
          python - <<'PY'
          import urllib.request,urllib.parse,json
          lat,lon=39.129,9.181
          layer='raster:DTM_10M_ALTIMETRIA_REV01_GEOS'
          d=.001
          p=dict(service='WMS',version='1.1.1',request='GetFeatureInfo',
              layers=layer,query_layers=layer,styles='',srs='EPSG:4326',
              bbox=f'{lon-d},{lat-d},{lon+d},{lat+d}',width='101',height='101',
              x='50',y='50',info_format='application/json',feature_count='1')
          for host in ['https://webgis.regione.sardegna.it/geoserverraster/ows',
                       'https://webgis.regione.sardegna.it/geoserverraster/wms']:
            for fmt in ['application/json','text/plain']:
              p['info_format']=fmt
              url=host+'?'+urllib.parse.urlencode(p)
              try:
                with urllib.request.urlopen(urllib.request.Request(url,headers={'User-Agent':'SardegnaMeteoLive/1.0'}),timeout=13) as r:
                  b=r.read(5000)
                  print('REGIONE',fmt,r.status,r.headers.get('Content-Type'),repr(b[:1200]),flush=True)
              except Exception as e: print('REGIONE ERROR',fmt,str(e)[:350],flush=True)
          url='https://api.opentopodata.org/v1/srtm30m?locations=39.129,9.181'
          try:
            with urllib.request.urlopen(url,timeout=15) as r:
              print('SRTM',r.status,repr(r.read(1500)),flush=True)
          except Exception as e:print('SRTM ERROR',str(e)[:350],flush=True)
          PY
