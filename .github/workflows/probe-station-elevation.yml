name: Verifica fonte quota altimetrica stazioni
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/probe-station-elevation.yml'
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Interroga DTM regionale 10m e confronto SRTM 30m
        run: |
          python - <<'PY'
          import urllib.request,urllib.parse,json
          layer='raster:DTM_10M_ALTIMETRIA_REV01_GEOS'
          for name,lat,lon in [
            ('Abbasanta',40.13028,8.81389),
            ('Gergei',39.69778,9.10556),
            ('Monte Arci',39.79,8.74),
            ('Campidano',39.320,9.050)]:
            d=.0002
            p=dict(service='WMS',version='1.1.1',request='GetFeatureInfo',
                   layers=layer,query_layers=layer,styles='',srs='EPSG:4326',
                   bbox=f'{lon-d},{lat-d},{lon+d},{lat+d}',width='101',height='101',
                   x='50',y='50',info_format='application/json',feature_count='1')
            url='https://webgis.regione.sardegna.it/geoserverraster/ows?'+urllib.parse.urlencode(p)
            try:
              with urllib.request.urlopen(url,timeout=15) as r:
                j=json.loads(r.read(4000))
                print('REGIONE',name, j.get('features',[{}])[0].get('properties'),flush=True)
            except Exception as e: print('REGIONE ERROR',name,str(e)[:220],flush=True)
            url='https://api.opentopodata.org/v1/srtm30m?'+urllib.parse.urlencode({'locations':f'{lat},{lon}'})
            try:
              with urllib.request.urlopen(url,timeout=15) as r:
                j=json.loads(r.read(2000))
                print('SRTM',name,j.get('results',[{}])[0].get('elevation'),flush=True)
            except Exception as e:print('SRTM ERROR',name,str(e)[:220],flush=True)
          PY
