name: Aggiorna allerte MeteoAlarm Mediterraneo

on:
  workflow_dispatch:
  schedule:
    - cron: '*/5 * * * *'
  push:
    branches: [main]
    paths:
      - 'scripts/update_meteoalarm.py'
      - '.github/workflows/update-meteoalarm.yml'

permissions:
  contents: write

concurrency:
  group: meteoalarm-sardegna
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configura Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Scarica allerte MeteoAlarm
        run: python scripts/update_meteoalarm.py

      - name: Pubblica JSON aggiornato
        run: |
          git config user.name "sardegna-meteolive-data-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/meteoalarm.json
          if git diff --cached --quiet; then
            echo "Nessuna variazione nei dati"
            exit 0
          fi
          git commit -m "Aggiorna allerte MeteoAlarm Sardegna"
          if ! git push; then
            git fetch origin main
            git rebase -X theirs origin/main
            git push
          fi
