name: Debug MeteoAlarm MVT transport

on:
  workflow_dispatch:
  push:
    branches: [debug/meteoalarm-region-schema]
    paths:
      - '.github/workflows/update-meteoalarm.yml'

permissions:
  contents: read

jobs:
  debug:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configura Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Installa decoder MVT
        run: pip install mapbox-vector-tile
      - name: Verifica trasporto, CORS e schema
        run: |
          python - <<'PY'
          import math, urllib.request, urllib.parse, json, gzip, zlib
          from datetime import datetime, timezone
          import mapbox_vector_tile

          def tile(lon,lat,z):
              n=2**z
              return int((lon+180)/360*n), int((1-math.asinh(math.tan(math.radians(lat)))/math.pi)/2*n)

          ref=datetime.now(timezone.utc).isoformat(timespec="milliseconds").replace("+00:00","Z")
          x,y=tile(5.0,41.5,4)
          qs=urllib.parse.urlencode({"referenceDate":ref,"preset":"now"})
          url=f"https://visservice.meteoalarm.org/stream-buffers/live/tiles/4/{x}/{y}.mvt?{qs}"
          for origin in (None,"https://meteoalarm.org","https://matteotidili.github.io"):
              headers={"User-Agent":"Mozilla/5.0","Accept":"application/vnd.mapbox-vector-tile,*/*","Accept-Encoding":"gzip"}
              if origin: headers["Origin"]=origin
              req=urllib.request.Request(url,headers=headers)
              with urllib.request.urlopen(req,timeout=30) as r:
                  raw=r.read()
                  h=dict(r.headers)
                  print("RESPONSE",origin or "none","status",r.status,"bytes",len(raw),
                        "type",r.headers.get("Content-Type"),
                        "encoding",r.headers.get("Content-Encoding"),
                        "cors",r.headers.get("Access-Control-Allow-Origin"),
                        "vary",r.headers.get("Vary"),
                        "magic",raw[:8].hex())
              enc=(h.get("Content-Encoding") or h.get("content-encoding") or "").lower()
              if enc=="gzip" or raw[:2]==b"\x1f\x8b":
                  raw=gzip.decompress(raw)
              elif enc=="deflate":
                  raw=zlib.decompress(raw)
              print("DECOMPRESSED",origin or "none","bytes",len(raw),"magic",raw[:16].hex())
              try:
                  decoded=mapbox_vector_tile.decode(raw)
                  print("LAYERS",origin or "none",list(decoded.keys()))
                  for layer_name,layer in decoded.items():
                      feats=layer.get("features",[])
                      print("LAYER",layer_name,"count",len(feats),"extent",layer.get("extent"))
                      for feat in feats[:8]:
                          print("FEATURE",layer_name,json.dumps({
                              "id":feat.get("id"),
                              "type":feat.get("geometry",{}).get("type"),
                              "properties":feat.get("properties",{})
                          },ensure_ascii=False)[:5000])
              except Exception as e:
                  print("DECODE_ERROR",origin or "none",type(e).__name__,str(e))
          PY
