name: Debug MeteoAlarm MVT schema

on:
  workflow_dispatch:
  push:
    branches: [debug/meteoalarm-region-schema]
    paths:
      - '.github/workflows/update-meteoalarm.yml'

permissions:
  contents: read

jobs:
  debug:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configura Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Installa decoder MVT
        run: pip install mapbox-vector-tile
      - name: Decodifica tile MeteoAlarm
        run: |
          python - <<'PY'
          import math, urllib.request, urllib.parse, json
          from datetime import datetime, timezone
          import mapbox_vector_tile

          def tile(lon,lat,z):
              n=2**z
              x=int((lon+180)/360*n)
              y=int((1-math.asinh(math.tan(math.radians(lat)))/math.pi)/2*n)
              return x,y

          ref=datetime.now(timezone.utc).isoformat(timespec="milliseconds").replace("+00:00","Z")
          for name,lon,lat,z in [
              ("sardegna",9.0,40.0,5),
              ("med-occ",5.0,41.5,4),
              ("italia",12.0,42.0,5),
              ("francia",3.0,44.0,5),
              ("spagna",-3.0,40.0,5),
              ("balcani",18.0,43.0,5),
              ("grecia",23.0,39.0,5),
          ]:
              x,y=tile(lon,lat,z)
              qs=urllib.parse.urlencode({"referenceDate":ref,"preset":"now"})
              url=f"https://visservice.meteoalarm.org/stream-buffers/live/tiles/{z}/{x}/{y}.mvt?{qs}"
              req=urllib.request.Request(url,headers={"User-Agent":"SardegnaMeteoMonitor/1.0","Accept":"application/vnd.mapbox-vector-tile,*/*"})
              try:
                  with urllib.request.urlopen(req,timeout=30) as r:
                      raw=r.read()
                      print("TILE",name,z,x,y,"status",r.status,"bytes",len(raw),"cors",r.headers.get("Access-Control-Allow-Origin"))
                  decoded=mapbox_vector_tile.decode(raw)
                  print("LAYERS",name,list(decoded.keys()))
                  for layer_name,layer in decoded.items():
                      feats=layer.get("features",[])
                      print("LAYER",layer_name,"count",len(feats),"extent",layer.get("extent"))
                      for feat in feats[:5]:
                          print("FEATURE",layer_name,json.dumps({
                              "id":feat.get("id"),
                              "type":feat.get("geometry",{}).get("type"),
                              "properties":feat.get("properties",{})
                          },ensure_ascii=False)[:4000])
              except Exception as e:
                  print("ERROR",name,type(e).__name__,str(e))
          PY
