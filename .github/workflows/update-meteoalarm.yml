name: Debug MeteoAlarm map component

on:
  workflow_dispatch:
  push:
    branches: [debug/meteoalarm-region-schema]
    paths:
      - '.github/workflows/update-meteoalarm.yml'

permissions:
  contents: read

jobs:
  debug:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configura Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Ispeziona componente mappa e frame live
        run: |
          python - <<'PY'
          import re, urllib.request, urllib.parse, json
          html=urllib.request.urlopen("https://meteoalarm.org/en/live/",timeout=20).read().decode("utf-8","replace")
          main_path=re.search(r'src="(/assets/index\.[^"]+\.js)"',html).group(1)
          main=urllib.request.urlopen("https://meteoalarm.org"+main_path,timeout=30).read().decode("utf-8","replace")
          mm=re.search(r'import\("\./(Map\.[^"]+\.js)"\)',main)
          print("MAP_CHUNK",mm.group(1) if mm else "none")
          chunk=urllib.request.urlopen("https://meteoalarm.org/assets/"+mm.group(1),timeout=30).read().decode("utf-8","replace")
          layers=sorted(set(re.findall(r'["\']source-layer["\']\s*:\s*["\']([^"\']+)',chunk)))
          print("MAP_SOURCE_LAYERS",json.dumps(layers))
          for needle in ("source-layer","areaState","iconState","setFeatureState","mapLayerUrls","vector","promoteId","fid","levelId"):
              start=0;hits=0
              while hits<15:
                  i=chunk.find(needle,start)
                  if i<0: break
                  print("MAP_CTX",needle,chunk[max(0,i-1200):i+2600])
                  start=i+len(needle);hits+=1
          from datetime import datetime, timezone
          ref=datetime.now(timezone.utc).isoformat(timespec="milliseconds").replace("+00:00","Z")
          q=urllib.parse.urlencode({"preset":"now","referenceDate":ref})
          url="https://visservice.meteoalarm.org/api/v1/stream-buffers/live/frames?"+q
          try:
              req=urllib.request.Request(url,headers={"User-Agent":"SardegnaMeteoMonitor/1.0","Accept":"application/json"})
              with urllib.request.urlopen(req,timeout=30) as r:
                  raw=r.read()
              print("FRAMES_STATUS",len(raw),raw[:16000].decode("utf-8","replace"))
          except Exception as e:
              print("FRAMES_ERROR",type(e).__name__,str(e))
          PY
