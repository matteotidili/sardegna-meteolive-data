name: Debug MeteoAlarm vector tiles

on:
  workflow_dispatch:
  push:
    branches: [debug/meteoalarm-region-schema]
    paths:
      - '.github/workflows/update-meteoalarm.yml'

permissions:
  contents: read

jobs:
  debug:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configura Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Ispeziona frontend e API visservice
        run: |
          python - <<'PY'
          import re, urllib.request, json
          html=urllib.request.urlopen("https://meteoalarm.org/en/live/",timeout=20).read().decode("utf-8","replace")
          m=re.search(r'src="(/assets/index\.[^"]+\.js)"',html)
          print("ASSET",m.group(1) if m else "none")
          js=urllib.request.urlopen("https://meteoalarm.org"+m.group(1),timeout=30).read().decode("utf-8","replace")
          layers=sorted(set(re.findall(r'["\']source-layer["\']\s*:\s*["\']([^"\']+)',js)))
          print("SOURCE_LAYERS",json.dumps(layers))
          for needle in ("APP_VIS_SERVICE_API_URL","stream-buffers/","/frames","referenceDateISO","areaStyles","iconStyles","featuresInCurrentFrame"):
              start=0;hits=0
              while hits<12:
                  i=js.find(needle,start)
                  if i<0: break
                  print("CTX",needle,js[max(0,i-1400):i+2800])
                  start=i+len(needle);hits+=1
          PY
