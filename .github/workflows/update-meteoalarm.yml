name: Aggiorna allerte MeteoAlarm Mediterraneo

on:
  workflow_dispatch:
  schedule:
    - cron: '*/5 * * * *'
  push:
    branches: [main, debug/meteoalarm-region-schema]
    paths:
      - 'scripts/update_meteoalarm.py'
      - '.github/workflows/update-meteoalarm.yml'

permissions:
  contents: write

concurrency:
  group: meteoalarm-mediterraneo
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configura Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Diagnostica endpoint cartografici MeteoAlarm
        run: |
          python - <<'PY'
          import re, urllib.request, urllib.error
          from datetime import datetime, timezone, timedelta
          now=datetime.now(timezone.utc)
          start=(now-timedelta(hours=12)).isoformat(timespec="milliseconds").replace("+00:00","Z")
          end=(now+timedelta(hours=48)).isoformat(timespec="milliseconds").replace("+00:00","Z")
          query=f"?startDate={start}&endDate={end}&language=en&include_geocodes=1"
          for url in (
              "https://api.meteoalarm.org/metadata/v1/geocodes",
              "https://api.meteoalarm.org/metadata/v1/geocode-aliases",
              "https://hub.meteoalarm.org/api/v1/stream-buffers/all-warnings/warnings"+query,
              "https://feeds.meteoalarm.org/api/v1/warnings/all-warnings"+query,
          ):
              try:
                  req=urllib.request.Request(url,headers={"User-Agent":"SardegnaMeteoMonitor/1.0","Accept":"application/json"})
                  with urllib.request.urlopen(req,timeout=20) as r:
                      body=r.read(12000).decode("utf-8","replace")
                      print("DEBUG_ENDPOINT",url,"status",r.status,"body",body[:2500])
              except urllib.error.HTTPError as e:
                  print("DEBUG_ENDPOINT",url,"status",e.code,"body",e.read().decode("utf-8","replace")[:2500])
              except Exception as e:
                  print("DEBUG_ENDPOINT",url,"error",type(e).__name__,str(e))
          html=urllib.request.urlopen("https://meteoalarm.org/en/live/",timeout=20).read().decode("utf-8","replace")
          m=re.search(r'src="(/assets/index\.[^"]+\.js)"',html)
          print("DEBUG_FRONTEND_ASSET",m.group(1) if m else "not-found")
          if m:
              js=urllib.request.urlopen("https://meteoalarm.org"+m.group(1),timeout=30).read().decode("utf-8","replace")
              for needle in ("APP_WARNINGTILES_URL","warningtiles","warningTiles","warning-tile","/tiles/","{z}"):
                  start=0
                  hits=0
                  while True:
                      i=js.find(needle,start)
                      if i<0 or hits>=8: break
                      print("DEBUG_JS",needle,js[max(0,i-900):i+1800])
                      start=i+len(needle);hits+=1
          PY

      - name: Scarica allerte MeteoAlarm
        run: python scripts/update_meteoalarm.py

      - name: Pubblica JSON aggiornato
        run: |
          git config user.name "sardegna-meteolive-data-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/meteoalarm.json
          if git diff --cached --quiet; then
            echo "Nessuna variazione nei dati"
            exit 0
          fi
          git commit -m "Aggiorna allerte MeteoAlarm Mediterraneo"
          if ! git push; then
            git fetch origin main
            git rebase -X theirs origin/main
            git push
          fi
