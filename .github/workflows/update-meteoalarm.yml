name: Aggiorna allerte MeteoAlarm Mediterraneo

on:
  workflow_dispatch:
  schedule:
    - cron: '*/5 * * * *'
  push:
    branches: [main, fix/meteoalarm-upcoming-map]
    paths:
      - 'scripts/update_meteoalarm.py'
      - 'scripts/update_meteoalarm_map.py'
      - 'data/meteoalarm_regions_mediterraneo.json'
      - 'data/meteoalarm_map.geojson'
      - '.github/workflows/update-meteoalarm.yml'

permissions:
  contents: write

concurrency:
  group: meteoalarm-mediterraneo
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configura Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Installa dipendenze mappa MeteoAlarm
        run: pip install mapbox-vector-tile shapely

      - name: Scarica allerte MeteoAlarm
        run: python scripts/update_meteoalarm.py

      - name: Genera layer cartografico MeteoAlarm
        run: python scripts/update_meteoalarm_map.py

      - name: Pubblica dati aggiornati
        run: |
          git config user.name "sardegna-meteolive-data-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/meteoalarm.json data/meteoalarm_map.geojson data/meteoalarm_geometry_cache.json
          if git diff --cached --quiet; then
            echo "Nessuna variazione nei dati"
            exit 0
          fi
          git commit -m "Aggiorna allerte MeteoAlarm Mediterraneo"
          if ! git push; then
            git fetch origin main
            git rebase -X theirs origin/main
            git push
          fi
