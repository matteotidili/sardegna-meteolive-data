name: Debug MeteoAlarm feature API

on:
  workflow_dispatch:
  push:
    branches: [debug/meteoalarm-region-schema]
    paths:
      - '.github/workflows/update-meteoalarm.yml'

permissions:
  contents: read

jobs:
  debug:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Configura Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Prova frame e warning per feature
        run: |
          python - <<'PY'
          import json, urllib.request, urllib.parse, gzip, math
          from datetime import datetime, timezone
          import subprocess, sys
          subprocess.check_call([sys.executable,"-m","pip","install","-q","mapbox-vector-tile"])
          import mapbox_vector_tile

          UA={"User-Agent":"Mozilla/5.0","Accept":"application/json,*/*"}
          ref=datetime.now(timezone.utc).isoformat(timespec="milliseconds").replace("+00:00","Z")
          def get(url, headers=None):
              req=urllib.request.Request(url,headers={**UA,**(headers or {})})
              with urllib.request.urlopen(req,timeout=30) as r:
                  raw=r.read()
                  if (r.headers.get("Content-Encoding") or "").lower()=="gzip":
                      raw=gzip.decompress(raw)
                  return r.status, dict(r.headers), raw

          candidates=[
            "https://visservice.meteoalarm.org/api/v1/stream-buffers/live/frames",
            "https://visservice.meteoalarm.org/api/v1/stream-buffers/live/frames?"+urllib.parse.urlencode({"referenceDate":ref}),
            "https://visservice.meteoalarm.org/api/v1/stream-buffers/live/frames?"+urllib.parse.urlencode({"referenceDate":ref,"preset":"now"}),
          ]
          for u in candidates:
              try:
                  st,h,b=get(u)
                  print("FRAMES",u,"STATUS",st,"TYPE",h.get("Content-Type"),"BODY",b[:12000].decode("utf-8","replace"))
              except Exception as e:
                  print("FRAMES_ERR",u,type(e).__name__,str(e))

          def tile(lon,lat,z):
              n=2**z
              return int((lon+180)/360*n), int((1-math.asinh(math.tan(math.radians(lat)))/math.pi)/2*n)
          z=4; x,y=tile(5.0,41.5,z)
          q=urllib.parse.urlencode({"referenceDate":ref,"preset":"now"})
          u=f"https://visservice.meteoalarm.org/stream-buffers/live/tiles/{z}/{x}/{y}.mvt?{q}"
          st,h,b=get(u,{"Accept":"application/vnd.mapbox-vector-tile,*/*","Accept-Encoding":"gzip"})
          d=mapbox_vector_tile.decode(b)
          areas=d.get("areas",{}).get("features",[])
          print("AREA_COUNT",len(areas))
          for f in areas[:5]:
              fid=f.get("properties",{}).get("uuid")
              print("AREA",fid,f.get("properties",{}))
              for params in (
                  {},
                  {"referenceDate":ref},
                  {"referenceDate":ref,"preset":"now"},
                  {"locale":"en","referenceDate":ref,"preset":"now"},
              ):
                  url=f"https://visservice.meteoalarm.org/api/v1/stream-buffers/live/features/{fid}/warnings"
                  if params: url += "?" + urllib.parse.urlencode(params)
                  try:
                      st,h,b=get(url)
                      print("WARN",fid,params,"STATUS",st,"BODY",b[:16000].decode("utf-8","replace"))
                  except Exception as e:
                      print("WARN_ERR",fid,params,type(e).__name__,str(e))
          PY
