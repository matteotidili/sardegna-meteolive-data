name: Probe OPERA radar

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/probe-opera.yml'
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch RadarEU frames manifest
        run: |
          python - <<'PY'
          import urllib.request,json
          UA='Mozilla/5.0'
          u='https://tiles.radareu.cz/tiles/nimbus/rate/frames.json'
          req=urllib.request.Request(u,headers={'User-Agent':UA,'Referer':'https://radareu.cz/'})
          r=urllib.request.urlopen(req,timeout=30)
          print('STATUS',r.status)
          print('HEADERS',dict(r.headers))
          raw=r.read().decode('utf-8','replace')
          print(raw[:30000])
          PY
