name: Probe OPERA radar

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/probe-opera.yml'
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Check OPERA CORS
        run: |
          python - <<'PY'
          import urllib.request, urllib.parse, xml.etree.ElementTree as ET
          from datetime import datetime,timezone,timedelta
          base='https://s3.waw3-1.cloudferro.com/openradar-24h'
          for d in [datetime.now(timezone.utc), datetime.now(timezone.utc)-timedelta(days=1)]:
              prefix=d.strftime('%Y/%m/%d/OPERA/COMP/')
              u=base+'?'+urllib.parse.urlencode({'list-type':'2','prefix':prefix})
              req=urllib.request.Request(u,headers={'Origin':'https://matteotidili.github.io'})
              r=urllib.request.urlopen(req,timeout=30)
              print('LIST_CORS',r.headers.get('Access-Control-Allow-Origin'),r.headers.get('Access-Control-Allow-Methods'))
              root=ET.fromstring(r.read())
              keys=[e.text for e in root.iter() if e.tag.endswith('Key') and e.text and e.text.endswith('@DBZH.tiff')]
              if keys:
                  t=base+'/'+keys[-1]
                  req=urllib.request.Request(t,headers={'Origin':'https://matteotidili.github.io','Range':'bytes=0-1023'})
                  rr=urllib.request.urlopen(req,timeout=30)
                  print('TIFF_CORS',rr.headers.get('Access-Control-Allow-Origin'),rr.headers.get('Access-Control-Allow-Headers'),rr.status,rr.headers.get('Content-Range'))
                  break
          PY
