name: Probe OPERA radar

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/probe-opera.yml'
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect RadarEU assets and legacy image
        run: |
          python - <<'PY'
          import urllib.request,re
          from datetime import datetime,timezone,timedelta
          html=urllib.request.urlopen('https://radareu.cz/',timeout=30).read().decode('utf-8','replace')
          print('HTML_LEN',len(html))
          for x in re.findall(r'(?:src|href)=["\']([^"\']+)["\']',html):
              if '.js' in x or '.css' in x:
                  print('ASSET',x)
          for d in [datetime.now(timezone.utc)-timedelta(minutes=i*5) for i in range(0,12)]:
              m=(d.minute//5)*5
              d=d.replace(minute=m,second=0,microsecond=0)
              u='https://radareu.cz/data/radar/radar.anim.'+d.strftime('%Y%m%d.%H%M')+'.0.png'
              try:
                  r=urllib.request.urlopen(urllib.request.Request(u,method='HEAD'),timeout=10)
                  print('LEGACY_OK',u,r.status,r.headers.get('Content-Length'),r.headers.get('Content-Type'))
                  break
              except Exception as e:
                  print('LEGACY_NO',u,type(e).__name__,e)
          PY
