name: Prova unificazione MeteoHub DPCN e MNW
# Sondaggio di tutte le variabili di MeteoHub: solo su richiesta manuale.
# Evita estrazioni supplementari ad ogni commit durante il funzionamento operativo.
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: probe-meteohub-combined
  cancel-in-progress: false
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Prova un'unica estrazione senza pubblicare dati
        env:
          METEOHUB_USERNAME: ${{ secrets.METEOHUB_USERNAME }}
          METEOHUB_PASSWORD: ${{ secrets.METEOHUB_PASSWORD }}
        run: python scripts/probe_meteohub_combined.py
