name: Diagnostica parametri AROME
on:
  push:
    branches: [main]
    paths:
      - 'scripts/inspect_arome_params.py'
      - '.github/workflows/inspect-arome-params.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - run: pip install eccodes
      - run: python scripts/inspect_arome_params.py
