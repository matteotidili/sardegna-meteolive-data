name: Verifica accesso alla stazione WeatherLink condivisa (temporanea)
on:
  push:
    branches: [main]
    paths:
      - 'scripts/probe_weatherlink_station.py'
      - '.github/workflows/probe-weatherlink-station.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Controlla diritti API senza pubblicare dati
        env:
          WEATHERLINK_API_KEY: ${{ secrets.WEATHERLINK_API_KEY }}
          WEATHERLINK_API_SECRET: ${{ secrets.WEATHERLINK_API_SECRET }}
        run: python scripts/probe_weatherlink_station.py
