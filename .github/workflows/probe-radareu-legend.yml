name: Probe RadarEU legend

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/probe-radareu-legend.yml'

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Extract legend
        run: |
          python - <<'PY'
          import urllib.request,re
          req=urllib.request.Request('https://radareu.cz/',headers={'User-Agent':'Mozilla/5.0'})
          html=urllib.request.urlopen(req,timeout=30).read().decode('utf-8','replace')
          for pat in [r'const\s+STOPS\s*=\s*([^;]+);',r'let\s+STOPS\s*=\s*([^;]+);',r'var\s+STOPS\s*=\s*([^;]+);']:
              m=re.search(pat,html,re.S)
              if m:
                  print('STOPS=',m.group(1)[:5000])
          for key in ['legendStops','legend_stops','STOPS','WORDS']:
              for m in re.finditer(key,html):
                  print('CTX',html[max(0,m.start()-600):m.start()+2200])
                  break
          PY
