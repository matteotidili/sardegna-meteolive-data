name: Aggiorna vettori AROME 10m
on:
  # Il workflow AROME HD genera e pubblica insieme raster e vettori.
  # Questo percorso ripara la corsa pubblicata su richiesta o quando cambia
  # il codice dei vettori; non dipende dal push di forecast.json del bot.
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/update_arome_wind_vectors.py'
      - 'scripts/arome_bundle.py'
      - '.github/workflows/update-arome-wind-vectors.yml'
permissions:
  contents: write
concurrency:
  group: ar0me-hd-sardegna
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Installa decodifica GRIB2
        run: python3 -m pip install --disable-pip-version-check numpy eccodes
      - name: Genera vettori 10m 51 scadenze
        run: python3 scripts/update_arome_wind_vectors.py
      - name: Valida la griglia binaria e le scadenze
        run: python3 scripts/arome_bundle.py validate
      - name: Pubblica vettori e metadati, se aggiornati
        run: python3 scripts/arome_bundle.py publish --mode vectors
