name: Scopri WU Sardegna sud-est

on:
  workflow_dispatch:
  # Esecuzione solo manuale, sempre limitata a 12 query.
permissions:
  contents: write

concurrency:
  group: observations-wunderground
  cancel-in-progress: false

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configura Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Scansione WU sud-est
        env:
          WU_API_KEY: ${{ secrets.WU_API_KEY }}
        run: python scripts/discover_wu_southeast.py

       - name: Pubblica inventario e osservazioni
        run: |
          git config user.name "sardegna-meteolive-data-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/wunderground_stations.json
          if [ -f data/wunderground_api_health.json ]; then
            git add data/wunderground_api_health.json
          fi
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Scansione mirata WU sud-est"
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git rebase -X theirs origin/main
            if git push origin HEAD:main; then exit 0; fi
            sleep "$attempt"
          done
          exit 1
