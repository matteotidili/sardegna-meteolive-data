name: Scopri WU Sardegna sud-est

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/discover_wu_southeast.py'
      - '.github/workflows/discover-wu-southeast.yml'

permissions:
  contents: write

concurrency:
  group: discover-wunderground
  cancel-in-progress: true

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configura Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Scansione WU sud-est
        env:
          WU_API_KEY: ${{ secrets.WU_API_KEY }}
        run: python scripts/discover_wu_southeast.py

      - name: Aggiorna osservazioni WU
        env:
          WU_API_KEY: ${{ secrets.WU_API_KEY }}
          FORCE_UPDATE: '1'
        run: python scripts/update_wunderground.py

      - name: Pubblica inventario e osservazioni
        run: |
          git config user.name "sardegna-meteolive-data-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/wunderground_stations.json data/wunderground.json
          git commit -m "Aggiorna PWS Weather Underground sud-est" || exit 0
          if ! git push; then
            git pull --rebase
            git push
          fi
