name: Aggiorna boe ISPRA Mareografico
on:
  schedule:
    - cron: '*/10 * * * *'
  push:
    branches: [main]
    paths: ['scripts/update_mareografico.py', '.github/workflows/update-mareografico.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: observations-mareografico
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Acquisisci osservazioni delle boe sarde
        run: python scripts/update_mareografico.py
      - name: Pubblica il JSON se aggiornato
        run: |
          git config user.name "sardegna-meteolive-data-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/mareografico.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Aggiorna osservazioni boe ISPRA"
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git rebase origin/main
            if git push origin HEAD:main; then exit 0; fi
            sleep "$attempt"
          done
          exit 1
